<!-- @dsCard group="Components" name="Header" subtitle="Floating white pill nav — Burbank Big nav links, kit-spec CTAs, full-res logo" -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Burbank Big';src:url('../assets/fonts/BurbankBig-Bold.woff2') format('woff2');font-weight:700;font-style:normal}
  body{margin:0;padding:0;font-family:'Sofia Sans',Arial,sans-serif;background:linear-gradient(160deg,#57C8F2,#0A4A7A);min-height:220px}
  .shell{padding:20px 24px}
  .pill{
    background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,20,40,.18);
    display:flex;align-items:center;gap:20px;padding:10px 18px;max-width:1180px;margin:0 auto;
  }
  .logo img{height:64px;display:block}
  nav{display:flex;gap:22px;flex:1;justify-content:center;flex-wrap:wrap}
  nav a{
    font-family:'Burbank Big',Impact,sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;
    color:#003D6A;text-decoration:none;letter-spacing:.5px;display:inline-flex;align-items:center;gap:4px;
  }
  nav a:hover{color:#F24E45}
  nav a .car{font-size:10px;color:#F24E45}
  .ctas{display:flex;gap:12px;align-items:center}
  .btn{
    font-family:'Burbank Big',Impact,sans-serif;font-weight:700;font-size:14px;line-height:1;text-transform:uppercase;
    text-decoration:none;padding:12px 20px 10px;border-radius:12px;letter-spacing:.5px;white-space:nowrap;
    border:1px solid;border-bottom-width:4px;transition:background .15s,border-color .15s;
  }
  .btn-primary{background:#F24E45;color:#fff;border-color:#A7130C}
  .btn-primary:hover{background:#A7130C;border-color:#F24E45}
  .btn-call{background:#003D6A;color:#fff;border-color:#062F4F}
  .btn-call:hover{background:#062F4F;border-color:#003D6A}
  @media (max-width:900px){nav{display:none}}
</style></head><body>
<div class="shell">
  <header class="pill">
    <a class="logo" href="/"><img src="../assets/logo-full.webp" alt="Perfect Catch — Swimming Pool Repair, Gas & Electric"></a>
    <nav>
      <a href="#">Pool Repair <span class="car">&#9660;</span></a>
      <a href="#">Electric <span class="car">&#9660;</span></a>
      <a href="#">About Us <span class="car">&#9660;</span></a>
      <a href="#">Service Areas</a>
    </nav>
    <div class="ctas">
      <a class="btn btn-primary" href="#">Request Service</a>
      <a class="btn btn-call" href="tel:7273165206">Call 727-316-5206</a>
    </div>
  </header>
</div>
</body></html>
